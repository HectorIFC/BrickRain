name: Release

# Conventional-commit driven SemVer releases. On every push to main a tag is
# computed; when a new tag results, the channel is built, the version is written
# into the manifest, and a GitHub Release is published with the sideloadable
# brickrain-vX.Y.Z.zip attached.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tagging)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          # brs-node 2.2.0 uses Iterator Helpers (.values().map(...)) and fails
          # to load on Node 20; Node 22+ (V8 12.3) is required.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dry_run computes the next version WITHOUT creating the tag. The tag is
      # created atomically by the release step below, so a failed build never
      # leaves an orphaned tag that would block the version from ever releasing.
      - name: Compute next tag
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b  # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          dry_run: true

      # Every step below is skipped when no new tag was produced (i.e. the new
      # tag equals the previous one), so a no-op push never creates a release.
      - name: Write version into the manifest
        if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        env:
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
        run: node scripts/sync-version.js "$NEW_VERSION"

      - name: Build channel package
        if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        run: npm run build

      - name: Name the release artifact
        if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: cp out/brickrain.zip "brickrain-${NEW_TAG}.zip"

      - name: Publish GitHub Release
        if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          # Creates the tag at the pushed commit only when this step runs, i.e.
          # after the build succeeded - tag and release are published together.
          tag_name: ${{ steps.tag.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.new_tag }}
          files: brickrain-${{ steps.tag.outputs.new_tag }}.zip
          generate_release_notes: true
